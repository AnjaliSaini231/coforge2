version: 2

models:
  - name: stg_nations
    description: stging table for all nations
    columns:
      - name: nation_id
        description: where it is primary key national id 
        tests:
          - unique:
              config:
                store_failures: true
          - not_null:
              config:
                store_failures: true
      - name: region_id
        description: region foregin key from region table
        tests:
          - relationships:
              arguments:
                to: ref('stg_regions')
                field: region_id
  - name: stg_regions
    columns:
      - name: region_id
        description: '{{ doc("pkey")}}'
      - name: name
        description: '{{ doc("overview")}}'
        tests:
          - accepted_values:
              arguments:
                values:
                  - "AFRICA"
                  - "AMERICA"
                  - "ASIA"
                  - "EUROPE"
                  - "MIDDLE EAST"
                  